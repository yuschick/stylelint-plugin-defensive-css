name: Pull Request - Checks

permissions:
  contents: read

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Require a Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+'

          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR titles become changelog entries, so they must follow Conventional Commits, such as 'fix(require-flex-wrap): handle nesting'."
            exit 1
          fi

  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check package
        run: npm run check:package

  test:
    name: Test (Stylelint ${{ matrix.stylelint }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The lowest supported versions, matching peerDependencies and engines
          - stylelint: '16.7.0'
            node: '22.12.0'
          - stylelint: '16'
            node: '22'
          - stylelint: '17'
            node: '22'
          - stylelint: '18'
            node: '24'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Stylelint ${{ matrix.stylelint }}
        env:
          STYLELINT_VERSION: ${{ matrix.stylelint }}
        run: npm install --no-save --legacy-peer-deps "stylelint@$STYLELINT_VERSION"

      - name: Run tests
        run: npm run test
